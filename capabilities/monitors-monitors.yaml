      - name: getmonitor
        method: GET
        description: Exa Get a Monitor
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The monitor ID
          required: true
      - name: updatemonitor
        method: PATCH
        description: Exa Update a Monitor
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
