naftiko: 1.0.0-alpha2
info:
  label: "Exa Monitors API \u2014 Monitors"
  description: "Exa Monitors API \u2014 Monitors. 16 operations. Lead operation: Create a Monitor. Self-contained Naftiko\
    \ capability covering one Exa business surface."
  tags:
  - Exa
  - Monitors
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    EXA_API_KEY: EXA_API_KEY
capability:
  consumes:
  - type: http
    namespace: monitors
    baseUri: https://api.exa.ai
    description: "Exa Monitors API \u2014 Monitors business capability. Self-contained, no shared references."
    resources:
    - name: monitors
      path: /monitors
      operations:
      - name: createmonitor
        method: POST
        description: Exa Create a Monitor
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: listmonitors
        method: GET
        description: Exa List Monitors
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: status
          required: false
        - name: cursor
          in: query
          type: string
          description: cursor
          required: false
        - name: limit
          in: query
          type: integer
          description: limit
          required: false
        - name: name
          in: query
          type: string
          description: name
          required: false
        - name: metadata
          in: query
          type: object
          description: 'Filter monitors by metadata key-value pairs (exact match, AND semantics). Use bracket notation: `metadata[key]=value`.'
          required: false
    - name: monitors-batch
      path: /monitors/batch
      operations:
      - name: batchmonitors
        method: POST
        description: Exa Batch Action on Monitors
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
