    - name: v0-monitors
      path: /v0/monitors
      operations:
      - name: monitorscreate
        method: POST
        description: Exa Create a Monitor
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
