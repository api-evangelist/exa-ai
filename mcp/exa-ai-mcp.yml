description: Exa operates an official remote MCP server at https://mcp.exa.ai/mcp. It runs a free, rate-limited
  tier with no auth; paid/agent tools authenticate with an Exa API key (x-api-key header) or OAuth. The
  OAuth protected-resource metadata (well-known/exa-ai-mcp-oauth-protected-resource.json) points at the
  authorization server https://auth.exa.ai (scope mcp:tools, PKCE S256). A local stdio server ships as
  npx exa-mcp-server (github.com/exa-labs/exa-mcp-server); a dedicated Websets MCP server is at github.com/exa-labs/websets-mcp-server.
  Tools captured verbatim from the Exa MCP documentation.
server:
  name: exa
  transport: http
  url: https://mcp.exa.ai/mcp
  auth: none-or-apikey
  free_tier: true
  protected_resource: well-known/exa-ai-mcp-oauth-protected-resource.json
  authorization_server: https://auth.exa.ai
  scopes:
  - mcp:tools
local:
- name: exa-mcp-server
  transport: stdio
  install: npx -y exa-mcp-server
  source: https://github.com/exa-labs/exa-mcp-server
- name: websets-mcp-server
  transport: stdio
  source: https://github.com/exa-labs/websets-mcp-server
tools:
- name: web_search_exa
  description: "Search the web for any topic and get clean, ready-to-use content.\n\n      Best for: Finding\
    \ current information, news, facts, people, companies, or answering questions about any topic.\n \
    \     Returns: Clean text content from top search results.\n\n      Query tips:\n      describe the\
    \ ideal page, not keywords. \"blog post comparing React and Vue performance\" not \"React vs Vue\"\
    .\n      Use category:people / category:company to search through Linkedin profiles / companies respectively.\n\
    \      If highlights are insufficient, follow up with web_fetch_exa on the best URLs."
  default: true
- name: web_fetch_exa
  description: 'Read a webpage''s full content as clean markdown. Use after web_search_exa when highlights
    are insufficient or to read any URL.


    Best for: Extracting full content from known URLs. Batch multiple URLs in one call.

    Returns: Clean text content and metadata from the page(s).'
  default: true
