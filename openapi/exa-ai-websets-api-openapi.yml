      - createdAt
      - updatedAt
    EnrichmentResult:
      type:
      - object
      properties:
        object:
          type: string
          const: enrichment_result
          default: enrichment_result
        status:
          type:
          - string
          enum:
          - pending
          - completed
          - canceled
          description: The status of the enrichment result.
        format:
          type:
          - string
          $ref: '#/components/schemas/WebsetEnrichmentFormat'
        result:
          type: array
          items:
            type:
            - string
          description: The result of the enrichment.
          nullable: true
        reasoning:
          type: string
          description: The reasoning for the result when an Agent is used.
          nullable: true
        references:
          type:
          - array
          items:
            type:
            - object
            properties:
              title:
                type: string
                description: The title of the reference
                nullable: true
              snippet:
                type: string
                description: The relevant snippet of the reference content
                nullable: true
              url:
                type:
                - string
                format: uri
                description: The URL of the reference
            required:
            - title
            - snippet
            - url
          description: The references used to generate the result.
        enrichmentId:
          type:
          - string
          description: The id of the Enrichment that generated the result
      required:
      - object
      - status
      - format
      - result
      - reasoning
      - references
      - enrichmentId
    CreateCriterionParameters:
      type:
      - object
      properties:
        description:
          type:
          - string
          minLength: 1
          maxLength: 1000
          description: The description of the criterion
      required:
      - description
    WebsetSearchBehavior:
      type: string
      enum:
      - override
      - append
  securitySchemes:
    apiKey:
      type: apiKey
      name: x-api-key
      in: header
      description: 'Pass your Exa API key in the x-api-key header. You can also authenticate with Authorization: Bearer <key>.'
    bearer:
      type: http
      scheme: bearer
      description: 'Pass your Exa API key in the x-api-key header. You can also authenticate with Authorization: Bearer <key>.'
